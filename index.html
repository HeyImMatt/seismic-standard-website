<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Seismic Standard - Indie Folk Trio">
    <title>Seismic Standard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Font Preload - Multiple strategies for mobile -->
    <link rel="preload" href="fonts/chinese.sthupo.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/chinese.sthupo.ttf" as="font" type="font/ttf">
    <style>
        /* Inline font loading for immediate availability */
        @font-face {
            font-family: 'Chinese Sthupo Inline';
            src: url('fonts/chinese.sthupo.ttf') format('truetype');
            font-display: swap;
        }
    </style>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#D94E2A',
                        'brand-yellow': '#FFB319',
                        'brand-brown': '#2E2222',
                        'brand-cream': '#F7F0E6',
                        'brand-cream-light': '#FFF8E8',
                        'brand-sage': '#6B7F6E',
                        'brand-olive': '#5C5C3D',
                        'brand-moss': '#4A5D3F',
                        'brand-teal': '#4F7A6B',
                        'brand-blue': '#5B7A8E',
                        'brand-slate': '#4A5B6B',
                        'brand-denim': '#627D96',
                        'brand-plum': '#5C3A4A',
                        'brand-wine': '#6B2E3E',
                        'brand-mauve': '#8B6A6F',
                        'brand-warm-gray': '#9B8F7E',
                        'brand-charcoal': '#3D3634',
                    },
                    fontFamily: {
                        'logo': ['Chinese Sthupo', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="text-brand-cream min-h-screen"
    style="background: linear-gradient(to bottom right, #2E2222, #3D3634, #5C3A4A); background-attachment: fixed; background-size: cover;">
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between py-4">
                <!-- Logo -->
                <div class="navbar-brand">
                    <a href="#" class="block">
                        <div id="nav-logo" class="w-80"></div>
                        <div id="nav-logo-text" class="hidden">Seismic Standard</div>
                    </a>
                </div>

                <!-- Desktop Navigation -->
                <div class="hidden md:flex space-x-8 items-center -mt-7">
                    <a href="#watch" class="nav-link">Watch</a>
                    <a href="#listen" class="nav-link">Listen</a>
                </div>

                <!-- Mobile Navigation -->
                <div class="md:hidden flex space-x-6 items-center -mt-7">
                    <a href="#watch" class="nav-link">Watch</a>
                    <a href="#listen" class="nav-link">Listen</a>
                </div>
            </div>
        </div>

    </nav>

    <!-- Hero Section -->
    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <!-- Band Photo with Overlay -->
        <div class="relative w-full h-full fade-in-up">
            <!-- Band Photo -->
            <div class="relative group w-full h-full">
                <div
                    class="absolute -inset-1 bg-gradient-to-r from-brand-orange to-brand-yellow rounded-lg blur opacity-30 group-hover:opacity-50 transition duration-500">
                </div>
                <img src="images/band-photo.jpg" alt="Seismic Standard Band"
                    class="relative rounded-lg shadow-2xl w-full h-full object-cover object-[50%_35%]">

                <!-- Dark Overlay for Text Readability -->
                <div class="absolute inset-0 bg-black/45 rounded-lg"></div>

                <!-- Next Show Overlay at Bottom Right -->
                <div class="absolute bottom-8 right-8 w-auto max-w-sm fade-in-up delay-300">
                    <div class="text-right hero-overlay-text">
                        <div class="bg-brand-brown/70 backdrop-blur-sm rounded-lg p-4 border border-brand-orange/30">
                            <h2 class="text-2xl font-bold text-brand-orange mb-4">Next Show</h2>
                            <div class="flex flex-col items-end gap-4">
                                <!-- Date/Time -->
                                <div class="text-brand-cream font-semibold text-lg">
                                    <span class="text-brand-yellow">FRIDAY</span> OCT 24 | 6:30PM
                                </div>
                                <!-- Venue -->
                                <div>
                                    <a href="https://maps.app.goo.gl/k2AgWppvb139D3fz9" target="_blank"
                                        class="text-xl font-bold text-brand-cream hover:text-brand-orange transition-colors">
                                        Revival Patio @ Bible Club
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Watch Section -->
    <section id="watch" class="pt-20 relative z-10">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">

            <div class="mb-10 fade-in-up delay-100">
                <div class="max-w-4xl mx-auto">
                    <div class="relative group">
                        <div
                            class="absolute -inset-1 bg-brand-orange rounded-lg blur opacity-30 group-hover:opacity-60 transition duration-500">
                        </div>
                        <div class="relative embed-container hover:transform-none">
                            <div
                                class="absolute inset-0 bg-gradient-to-br from-brand-brown to-brand-charcoal rounded-lg flex items-center justify-center">
                                <div class="text-center text-brand-cream p-8">
                                    <iframe width="1224" height="689" src="https://www.youtube.com/embed/oGW-PqW_ZJ0"
                                        title="Saturn Returns Live at Covert Cafe" frameborder="0"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-2xl font-bold text-brand-orange">Saturn Returns</h3>
                        <p class="text-brand-warm-gray">Covert Cafe 1/17/25</p>
                    </div>
                </div>
            </div>

            <!-- Watch More Button -->
            <div class="text-center fade-in-up delay-200">
                <a href="https://www.youtube.com/@seismicstandard" target="_blank"
                    class="btn-primary inline-flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                    Watch and Subscribe
                </a>
            </div>
        </div>
    </section>

    <!-- Listen Section -->
    <section id="listen" class="pt-20 relative z-10">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Track Grid -->
            <div class="grid md:grid-cols-2 gap-8 mb-16">
                <!-- Brave New World -->
                <div class="fade-in-up delay-200">
                    <div class="relative group">
                        <div
                            class="absolute -inset-1 bg-brand-yellow rounded-lg blur opacity-30 group-hover:opacity-60 transition duration-500">
                        </div>
                        <div class="relative bg-brand-brown rounded-lg p-6 border border-brand-yellow/20">
                            <h3 class="text-2xl font-bold text-brand-yellow mb-2 text-center">Brave New World</h3>
                            <div class="flex justify-center">
                                <iframe style="border: 0; width: 350px; height: 350px;"
                                    src="https://bandcamp.com/EmbeddedPlayer/track=4172939758/size=large/bgcol=2E2222/linkcol=FFB319/tracklist=false/minimal=true/transparent=true/"
                                    seamless><a href="https://seismicstandard.bandcamp.com/track/brave-new-world">Brave
                                        New World by Seismic Standard</a></iframe>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Never Comin' Home -->
                <div class="fade-in-up delay-100">
                    <div class="relative group">
                        <div
                            class="absolute -inset-1 bg-brand-orange rounded-lg blur opacity-30 group-hover:opacity-60 transition duration-500">
                        </div>
                        <div class="relative bg-brand-brown rounded-lg p-6 border border-brand-orange/20">
                            <h3 class="text-2xl font-bold text-brand-orange mb-2 text-center">Never Comin' Home</h3>
                            <div class="flex justify-center">
                                <iframe style="border: 0; width: 350px; height: 350px;"
                                    src="https://bandcamp.com/EmbeddedPlayer/track=1152541996/size=large/bgcol=2E2222/linkcol=D94E2A/tracklist=false/minimal=true/transparent=true/"
                                    seamless><a href="https://seismicstandard.bandcamp.com/track/never-comin-home">Never
                                        Comin&#39; Home by Seismic Standard</a></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 relative z-10">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <div class="flex justify-center space-x-6">
                    <a href="https://www.youtube.com/@SeismicStandard-ox1de" target="_blank"
                        class="text-brand-orange hover:text-brand-yellow transition-colors" aria-label="YouTube">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                        </svg>
                    </a>
                    <a href="https://www.instagram.com/seismicstandardmusic" target="_blank"
                        class="text-brand-orange hover:text-brand-yellow transition-colors" aria-label="Instagram">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                        </svg>
                    </a>
                    <a href="https://www.facebook.com/SeismicStandard" target="_blank"
                        class="text-brand-orange hover:text-brand-yellow transition-colors" aria-label="Facebook">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                        </svg>
                    </a>
                    <a href="https://seismicstandard.bandcamp.com/" target="_blank"
                        class="text-brand-orange hover:text-brand-yellow transition-colors" aria-label="Bandcamp">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.5" />
                            <path d="M6 8.5v7h8.5l3.5-7H6z" />
                        </svg>
                    </a>
                </div>
                <p class="text-brand-warm-gray mt-4">&copy; 2025 Seismic Standard</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
